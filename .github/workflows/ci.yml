name: platform-foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-git --redact --exit-code=1
      - name: Initialize disposable CI secrets and certificate
        run: |
          cp .env.example .env
          mkdir -p .local/secrets .local/tls
          printf '%s' "$(openssl rand -hex 32)" > .local/secrets/postgres_password
          openssl rand -hex 12 > .local/secrets/bootstrap_admin_username
          printf '%s' "$(openssl rand -hex 32)" > .local/secrets/bootstrap_admin_password
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout .local/tls/auth.key -out .local/tls/auth.crt -subj '/CN=auth.vaurenith.test' -addext 'subjectAltName=DNS:auth.vaurenith.test,DNS:admin.auth.vaurenith.test'
          cp .local/tls/auth.crt .local/tls/rootCA.pem
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build optimized Keycloak image
        run: docker compose build keycloak
      - name: Verify runtime image metadata
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' local/vaurenith-keycloak:26.8.2)"
          test -n "$user"
          test "$user" != root
          test "$user" != 0
          docker image inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' local/vaurenith-keycloak:26.8.2 | grep -F 'optimized'
      - name: Image vulnerability scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --severity CRITICAL --exit-code 1 local/vaurenith-keycloak:26.8.2
      - name: Start stack and verify readiness
        run: |
          echo '127.0.0.1 auth.vaurenith.test admin.auth.vaurenith.test' | sudo tee -a /etc/hosts
          docker compose up -d
          for attempt in $(seq 1 90); do
            if curl --silent --fail --insecure https://auth.vaurenith.test:8443/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Configure isolated master realm frontend URL
        run: make configure-admin-realm
      - name: Configure Backend-compatible access tokens
        run: |
          KEYCLOAK_ADMIN_USERNAME="$(cat .local/secrets/bootstrap_admin_username)" \
          KEYCLOAK_ADMIN_PASSWORD="$(cat .local/secrets/bootstrap_admin_password)" \
          make configure-backend-token-contract
      - name: Verify isolated PostgreSQL and protected management surfaces
        run: |
          for container in postgres keycloak; do
            container_id="$(docker compose ps -q "$container")"
            port_bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$container_id")"
            test "$port_bindings" = null || test "$port_bindings" = '{}'
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://auth.vaurenith.test:8443/admin/)" = 404
          docker compose exec -T postgres sh -ec 'PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")" psql --no-password --tuples-only --no-align --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command="SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND usename = current_user AND pid <> pg_backend_pid();" | grep -Eq "^[1-9][0-9]*$"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://admin.auth.vaurenith.test:8444/admin/master/console/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://admin.auth.vaurenith.test:8444/admin/serverinfo)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://auth.vaurenith.test:8443/realms/master/protocol/openid-connect/auth)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://auth.vaurenith.test:8443/admin/serverinfo)" = 404
          for container in proxy mailpit; do
            container_id="$(docker compose ps -q "$container")"
            published_hosts="$(docker inspect --format '{{range $port, $bindings := .HostConfig.PortBindings}}{{range $bindings}}{{.HostIp}}{{"\n"}}{{end}}{{end}}' "$container_id")"
            test -n "$published_hosts"
            test -z "$(printf '%s\n' "$published_hosts" | grep -v '^127\.0\.0\.1$' || true)"
          done
      - name: Verify realm and OIDC public contract
        run: python3 scripts/check-realm.py
      - name: PostgreSQL backup and isolated restore drill
        run: |
          ./scripts/backup.sh
          dump="$(find .local/backups -name '*.dump' -print -quit)"
          ./scripts/restore-test.sh "$dump"
      - if: always()
        name: Stop stack
        run: docker compose down -v
